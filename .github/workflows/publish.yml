# Publication automatique sur Modrinth + CurseForge à chaque release GitHub (mc-publish).
# Secrets requis (Settings → Secrets → Actions) : MODRINTH_TOKEN, CURSEFORGE_TOKEN.
# Variable requise (Settings → Variables → Actions) : CURSEFORGE_ID (id numérique du projet).
# Sans token CurseForge, mc-publish ne publie que sur Modrinth.
# Une pré-release GitHub est publiée en type "beta" sur les stores (utile quand une version
# cible une autre version de Minecraft que celle du serveur prod) ; une release normale en "release".
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Read versions
        id: v
        run: |
          echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "mc=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Changelog for this version
        id: cl
        run: |
          {
            echo 'body<<EOF'
            awk -v v="${{ steps.v.outputs.version }}" '
              $0 ~ "^## " v "( |$)" { on=1; next }
              /^## / && on { exit }
              on { print }' CHANGELOG.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish to Modrinth + CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          files: build/libs/!(*-sources).jar
          name: MinePiece Essentials ${{ steps.v.outputs.version }}
          version: ${{ steps.v.outputs.version }}
          version-type: ${{ github.event.release.prerelease && 'beta' || 'release' }}
          changelog: ${{ steps.cl.outputs.body }}
          loaders: fabric
          game-versions: ${{ steps.v.outputs.mc }}
          java: 25
          dependencies: fabric-api(required)

          modrinth-id: minepiece-essentials
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: v${{ steps.v.outputs.version }}
